name: release

on:
  # Disabled: workflows do not run under this account; uncomment if you fork this repository.
  # push:
  #   branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (X.Y.Z), tagged vX.Y.Z"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag and build the tarball
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          sh tools/release.sh "${{ inputs.version }}"
          git push origin "v${{ inputs.version }}"
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "v${{ inputs.version }}"
          "open-parcels-providers-${{ inputs.version }}.tgz"
          --title "v${{ inputs.version }}" --notes "open-parcels-providers ${{ inputs.version }}"
